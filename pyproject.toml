[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-skill-evolution"
version = "1.0.0"
description = "Autonomous skill improvement for Hermes Agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["hermes", "agent", "skills", "evolution", "self-improvement"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
dspy = [
    "dspy>=3.0.0",
]
optimizer = [
    "dspy>=3.0.0",
]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
